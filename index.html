/* ============================================================
   ЗУМ / ПАН
   ============================================================ */
function clampView() {
  const hw = COLS/(2*view.zoom), hh = ROWS/(2*view.zoom);
  view.cx = clamp(view.cx, hw, COLS-hw);
  view.cy = clamp(view.cy, hh, ROWS-hh);
}
function zoomTo(nz, apx, apy) {
  nz = clamp(nz, MIN_ZOOM, MAX_ZOOM);
  if (Math.abs(nz-view.zoom) < 0.0001) return;
  const osw = COLS/view.zoom, osh = ROWS/view.zoom;
  const osx = view.cx-osw/2, osy = view.cy-osh/2;
  const wx = osx+apx*osw, wy = osy+apy*osh;
  view.zoom = nz;
  const nsw = COLS/nz, nsh = ROWS/nz;
  view.cx = wx + (0.5-apx)*nsw;
  view.cy = wy + (0.5-apy)*nsh;
  clampView();
  updateZoomUI();
}
function updateZoomUI() {
  const t = (Math.log(view.zoom)-Math.log(MIN_ZOOM)) / (Math.log(MAX_ZOOM)-Math.log(MIN_ZOOM));
  el('z-slider').value = Math.round(t*1000);
  el('z-val').textContent = view.zoom.toFixed(1)+'×';
  el('s-zoom').textContent = view.zoom.toFixed(1)+'×';
}
function screenToWorld(cx, cy) {
  const rect = canvas.getBoundingClientRect();
  const px = clamp((cx-rect.left)/rect.width, 0, 1);
  const py = clamp((cy-rect.top)/rect.height, 0, 1);
  const sw = COLS/view.zoom, sh = ROWS/view.zoom;
  const sx = view.cx-sw/2, sy = view.cy-sh/2;
  return { wx: sx+px*sw, wy: sy+py*sh, px, py };
}
function screenToTile(cx, cy) {
  const { wx, wy } = screenToWorld(cx, cy);
  const x = Math.floor(wx), y = Math.floor(wy);
  if (x<0||y<0||x>=COLS||y>=ROWS) return -1;
  return y*COLS+x;
}

/* ============================================================
   УКАЗАТЕЛЬ / ЖЕСТЫ
   ============================================================ */
const pointer = { down:false, button:0, startX:0, startY:0,
                  lastClientX:0, lastClientY:0, moved:false, mode:'idle', lastTile:-1 };
const activePointers = new Map();
let pinchState = null;

function getTwoPointers() {
  const arr = [...activePointers.values()];
  if (arr.length < 2) return null;
  return [arr[0], arr[1]];
}

function onPointerDown(e) {
  // Игнорируем клики, которые попали в UI-элементы поверх канваса
  if (e.target !== canvas) return;

  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  // Pinch (2 пальца)
  if (activePointers.size === 2) {
    // Отменяем текущее действие
    pointer.down = false;
    pointer.mode = 'idle';
    const [a,b] = getTwoPointers();
    pinchState = {
      dist: Math.hypot(a.x-b.x, a.y-b.y),
      midX: (a.x+b.x)/2, midY: (a.y+b.y)/2,
      zoom: view.zoom, cx: view.cx, cy: view.cy,
    };
    canvas.style.cursor = 'grabbing';
    return;
  }

  if (activePointers.size > 2) return;

  if (e.button === 1 || e.shiftKey) pointer.mode = 'pan';
  else if (e.button === 2) pointer.mode = 'erase';
  else if (e.button === 0) {
    // Если armedDisaster — тап по карте разместит катастрофу
    if (armedDisaster) { pointer.mode = 'place-disaster'; }
    else if (tool === 'civ' && selectedCivId >= 0) pointer.mode = 'paint-civ';
    else if (tool === 'biome') pointer.mode = 'paint-biome';
    else if (tool === 'erase') pointer.mode = 'erase';
    else pointer.mode = 'idle';
  } else return;

  pointer.down = true; pointer.button = e.button;
  pointer.startX = e.clientX; pointer.startY = e.clientY;
  pointer.lastClientX = e.clientX; pointer.lastClientY = e.clientY;
  pointer.moved = false;
  pointer.lastTile = screenToTile(e.clientX, e.clientY);

  if (pointer.mode === 'paint-civ' && pointer.lastTile >= 0) applyBrush(pointer.lastTile, paintTileCiv);
  else if (pointer.mode === 'paint-biome' && pointer.lastTile >= 0) paintBrushBiome(pointer.lastTile);
  else if (pointer.mode === 'erase' && pointer.lastTile >= 0) applyBrush(pointer.lastTile, eraseTile);
  // place-disaster не применяется тут — только на pointerup, чтобы не срабатывало случайно

  canvas.setPointerCapture(e.pointerId);
  canvas.style.cursor = pointer.mode === 'pan' ? 'grabbing' : 'crosshair';
  e.preventDefault();
}

function onPointerMove(e) {
  if (activePointers.has(e.pointerId)) {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  }

  // Pinch — 2 пальца
  if (pinchState && activePointers.size >= 2) {
    const two = getTwoPointers();
    if (!two) return;
    const [a,b] = two;
    const dist = Math.hypot(a.x-b.x, a.y-b.y);
    const midX = (a.x+b.x)/2, midY = (a.y+b.y)/2;

    const scale = dist / pinchState.dist;
    const newZoom = clamp(pinchState.zoom * scale, MIN_ZOOM, MAX_ZOOM);

    const rect = canvas.getBoundingClientRect();
    const startMidPx = (pinchState.midX - rect.left) / rect.width;
    const startMidPy = (pinchState.midY - rect.top) / rect.height;
    const curMidPx = (midX - rect.left) / rect.width;
    const curMidPy = (midY - rect.top) / rect.height;

    const ssw = COLS / pinchState.zoom;
    const ssh = ROWS / pinchState.zoom;
    const ssx = pinchState.cx - ssw/2;
    const ssy = pinchState.cy - ssh/2;
    const wx = ssx + startMidPx * ssw;
    const wy = ssy + startMidPy * ssh;

    view.zoom = newZoom;
    const nsw = COLS / newZoom;
    const nsh = ROWS / newZoom;
    view.cx = wx - (curMidPx - 0.5) * nsw;
    view.cy = wy - (curMidPy - 0.5) * nsh;
    clampView();
    updateZoomUI();
    e.preventDefault();
    return;
  }

  if (pointer.down) {
    const dx = e.clientX - pointer.lastClientX, dy = e.clientY - pointer.lastClientY;
    const dist = Math.hypot(e.clientX - pointer.startX, e.clientY - pointer.startY);
    if (dist > 6) pointer.moved = true;

    if (pointer.mode === 'idle' && pointer.moved) {
      pointer.mode = 'pan';
      canvas.style.cursor = 'grabbing';
    }
    if (pointer.mode === 'pan') {
      const sw = COLS/view.zoom, sh = ROWS/view.zoom;
      const rect = canvas.getBoundingClientRect();
      view.cx -= dx/rect.width * sw;
      view.cy -= dy/rect.height * sh;
      clampView();
    } else if (pointer.mode === 'paint-civ' || pointer.mode === 'paint-biome' || pointer.mode === 'erase') {
      const t = screenToTile(e.clientX, e.clientY);
      if (t >= 0 && t !== pointer.lastTile) {
        const t0 = pointer.lastTile;
        const x0 = t0%COLS, y0 = (t0/COLS)|0;
        const x1 = t%COLS, y1 = (t/COLS)|0;
        const steps = Math.max(Math.abs(x1-x0), Math.abs(y1-y0));
        for (let s=1; s<=steps; s++) {
          const xx = Math.round(x0 + (x1-x0)*s/steps);
          const yy = Math.round(y0 + (y1-y0)*s/steps);
          const ii = yy*COLS+xx;
          if (pointer.mode === 'paint-civ') applyBrush(ii, paintTileCiv);
          else if (pointer.mode === 'paint-biome') paintBrushBiome(ii);
          else applyBrush(ii, eraseTile);
        }
        pointer.lastTile = t;
      }
    }
    pointer.lastClientX = e.clientX; pointer.lastClientY = e.clientY;
    e.preventDefault();
  }

  // Обновляем hover только на desktop (на мобильном будет мешать)
  if (!isMobile() || !pointer.down) {
    updateHover(e.clientX, e.clientY);
  } else {
    // На мобильном, если держим палец — покажем последнюю позицию для "armed" индикатора
    if (armedDisaster) {
      hoverTile = screenToTile(e.clientX, e.clientY);
    }
  }
}

function onPointerUp(e) {
  activePointers.delete(e.pointerId);

  // Закончился pinch
  if (pinchState && activePointers.size < 2) {
    pinchState = null;
  }

  if (!pointer.down) {
    return;
  }

  // Тап (без движения) — обрабатываем выбор/размещение
  if (!pointer.moved) {
    const i = screenToTile(e.clientX, e.clientY);
    if (i >= 0) {
      // Размещение "armed" катастрофы
      if (armedDisaster) {
        const { wx, wy } = screenToWorld(e.clientX, e.clientY);
        spawnDisaster(armedDisaster, wx, wy);
        clearArmedDisaster();
        return;
      }
      if (pointer.mode === 'idle') {
        const t = tiles[i];
        if (t.owner >= 0) {
          onSelectionChanged(selectedCivId === t.owner ? -1 : t.owner);
        } else if (t.land) {
          const c = createCivAt(i);
          if (c) onSelectionChanged(c.id);
        }
      }
    }
  }

  pointer.down = false; pointer.mode = 'idle'; pointer.lastTile = -1;
  canvas.style.cursor = 'crosshair';
  try { canvas.releasePointerCapture(e.pointerId); } catch(_){}
}

function onPointerCancel(e) {
  activePointers.delete(e.pointerId);
  if (pinchState && activePointers.size < 2) pinchState = null;
  if (pointer.down) {
    pointer.down = false; pointer.mode = 'idle'; pointer.lastTile = -1;
    canvas.style.cursor = 'crosshair';
  }
}

canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
canvas.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('pointercancel', onPointerCancel);
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ============================================================
   TOOLTIP
   ============================================================ */
const tooltip = el('tooltip');
function updateHover(cx, cy) {
  const rect = canvas.getBoundingClientRect();
  if (cx<rect.left||cx>rect.right||cy<rect.top||cy>rect.bottom) {
    tooltip.classList.remove('show'); hoverTile = -1; return;
  }
  const i = screenToTile(cx, cy);
  if (i < 0) { tooltip.classList.remove('show'); hoverTile = -1; return; }
  hoverTile = i;

  const t = tiles[i];
  const owner = t.owner>=0 && civs[t.owner] && !civs[t.owner].deleted ? civs[t.owner].name : 'нейтральная';
  const ownerColor = t.owner>=0 && civs[t.owner] && !civs[t.owner].deleted ? civs[t.owner].color : '#8fa3bf';
  let extra = '';
  if (t.owner>=0 && civs[t.owner] && !civs[t.owner].deleted) extra = `<br>Население: <b>${Math.round(civs[t.owner].pop)}</b>`;
  const hVal = isFinite(t.h) ? (t.h*100).toFixed(0)+'%' : '?';
  const mVal = isFinite(t.moist) ? (t.moist*100).toFixed(0)+'%' : '?';
  let lavaStr = '';
  if (t.lava > 0) {
    const heat = t.lava > 0.7 ? '🔥 свежая' : t.lava > 0.3 ? '🌡️ остывает' : '🪨 почти камень';
    lavaStr = `<br>Лава: <b style="color:#fb923c">${(t.lava*100).toFixed(0)}%</b> · ${heat}`;
  } else if (t.basalt) {
    lavaStr = `<br><span style="color:#94a3b8">🪨 застывший базальт</span>`;
  }

  tooltip.innerHTML =
    `<b>${BIOMES[t.biome].n}</b>${t.override ? ' <span style="color:#fbbf24">✎</span>' : ''}<br>` +
    `Высота: <b>${hVal}</b> · Плодородие: <b>${t.fert.toFixed(2)}</b><br>` +
    `Влажность: <b>${mVal}</b><br>` +
    `Территория: <b style="color:${ownerColor}">${owner}</b>${extra}${lavaStr}`;

  const sRect = stageEl.getBoundingClientRect();
  let tx = cx - sRect.left + 14, ty = cy - sRect.top + 14;
  tooltip.style.visibility = 'hidden';
  tooltip.classList.add('show');
  const tr = tooltip.getBoundingClientRect();
  tooltip.style.visibility = '';
  if (tx + tr.width > sRect.width - 8) tx = cx - sRect.left - tr.width - 14;
  if (ty + tr.height > sRect.height - 8) ty = cy - sRect.top - tr.height - 14;
  if (tx < 4) tx = 4;
  if (ty < 4) ty = 4;
  tooltip.style.left = tx+'px';
  tooltip.style.top  = ty+'px';
}

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const px = (e.clientX-rect.left)/rect.width;
  const py = (e.clientY-rect.top)/rect.height;
  const factor = e.deltaY < 0 ? 1.18 : 1/1.18;
  zoomTo(view.zoom*factor, px, py);
}, { passive: false });

/* ============================================================
   МИНИКАРТА
   ============================================================ */
function minimapJump(cx, cy) {
  const rect = minimapEl.getBoundingClientRect();
  const px = clamp((cx-rect.left)/rect.width, 0, 1);
  const py = clamp((cy-rect.top)/rect.height, 0, 1);
  view.cx = px*COLS; view.cy = py*ROWS;
  clampView();
}
el('minimap-wrap').addEventListener('pointerdown', e => {
  minimapJump(e.clientX, e.clientY);
  const onMove = ev => minimapJump(ev.clientX, ev.clientY);
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  e.preventDefault();
});

/* ============================================================
   DRAG & DROP (desktop) + armed disaster (mobile)
   ============================================================ */
let dragType = null, dragPreview = null;
let armedDisaster = null;

document.querySelectorAll('.disaster-btn').forEach(btn => {
  // Desktop drag
  btn.addEventListener('dragstart', e => {
    if (isMobile()) { e.preventDefault(); return; }
    dragType = btn.dataset.disaster;
    e.dataTransfer.effectAllowed = 'copy';
    e.dataTransfer.setData('text/plain', dragType);
    btn.classList.add('dragging');
    el('drag-hint').classList.add('show');
  });
  btn.addEventListener('dragend', () => {
    dragType = null; dragPreview = null;
    btn.classList.remove('dragging');
    el('drag-hint').classList.remove('show');
  });
  // Mobile: tap to arm
  btn.addEventListener('click', () => {
    if (!isMobile()) return;
    const type = btn.dataset.disaster;
    if (armedDisaster === type) clearArmedDisaster();
    else {
      armedDisaster = type;
      document.querySelectorAll('.disaster-btn').forEach(b => {
        b.classList.toggle('armed', b.dataset.disaster === type);
      });
      addLog(`👉 Тапните по карте, чтобы разместить: ${DISASTER_TYPES[type].icon} ${DISASTER_TYPES[type].name}`);
      closeDrawers();
    }
  });
});

function clearArmedDisaster() {
  armedDisaster = null;
  document.querySelectorAll('.disaster-btn').forEach(b => b.classList.remove('armed'));
}

canvas.addEventListener('dragover', e => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  if (!dragType) return;
  const { wx, wy } = screenToWorld(e.clientX, e.clientY);
  dragPreview = { type: dragType, wx, wy };
});
canvas.addEventListener('dragleave', () => { dragPreview = null; });
canvas.addEventListener('drop', e => {
  e.preventDefault();
  const type = dragType || e.dataTransfer.getData('text/plain');
  el('drag-hint').classList.remove('show');
  dragPreview = null;
  if (!type || !DISASTER_TYPES[type]) return;
  const { wx, wy } = screenToWorld(e.clientX, e.clientY);
  spawnDisaster(type, wx, wy);
  dragType = null;
});

function buildBiomePaletteInto(container, isMobilePalette) {
  container.innerHTML = '';
  for (const [key,b] of Object.entries(BIOMES)) {
    const rgb = `rgb(${b.c.join(',')})`;
    const item = document.createElement('div');
    if (isMobilePalette) {
      item.className = 'mb-item';
      item.dataset.biome = key;
      item.style.background = rgb;
      item.textContent = b.icon;
      item.title = b.n;
    } else {
      item.className = 'biome-item';
      item.dataset.biome = key;
      item.style.background = rgb;
      item.textContent = b.icon;
      item.title = b.n;
    }
    item.addEventListener('click', () => {
      selectedBiome = key;
      container.querySelectorAll('[data-biome]').forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      rebuildPaintBanner();
    });
    container.appendChild(item);
  }
  // Auto
  const autoItem = document.createElement('div');
  if (isMobilePalette) {
    autoItem.className = 'mb-item';
    autoItem.dataset.biome = 'auto';
    autoItem.style.background = '#2a3648';
    autoItem.style.color = '#8fa3bf';
    autoItem.style.fontSize = '10px';
    autoItem.textContent = 'auto';
    autoItem.title = 'Сбросить';
  } else {
    autoItem.className = 'biome-item';
    autoItem.dataset.biome = 'auto';
    autoItem.style.background = '#2a3648';
    autoItem.style.color = '#8fa3bf';
    autoItem.style.fontSize = '10px';
    autoItem.textContent = 'auto';
    autoItem.title = 'Сбросить';
  }
  autoItem.addEventListener('click', () => {
    selectedBiome = 'auto';
    container.querySelectorAll('[data-biome]').forEach(n => n.classList.remove('active'));
    autoItem.classList.add('active');
    rebuildPaintBanner();
  });
  container.appendChild(autoItem);
}

(function buildLegend() {

  el('legend').innerHTML = keys.map(k => {
    const c = BIOMES[k].c;
    return `<div><i style="background:rgb(${c[0]},${c[1]},${c[2]})"></i>${BIOMES[k].n}</div>`;
  }).join('');
})();

/* ============================================================
   ГОРЯЧИЕ КЛАВИШИ
   ============================================================ */
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') {
    if (armedDisaster) { clearArmedDisaster(); return; }
    if (isMobile()) { closeDrawers(); return; }
    if (tool !== 'view') {
      if (tool === 'civ') onSelectionChanged(-1);
      else setTool('view');
    } else if (selectedCivId >= 0) onSelectionChanged(-1);
  } else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'n' || e.key === 'N' || e.key === 'т' || e.key === 'Т') el('btn-step').click();
  else if (e.key === 'v' || e.key === 'V' || e.key === 'м' || e.key === 'М') setTool('view');
  else if (e.key === 'c' || e.key === 'C' || e.key === 'с' || e.key === 'С') { if (selectedCivId >= 0) setTool('civ'); }
  else if (e.key === 'b' || e.key === 'B' || e.key === 'и' || e.key === 'И') setTool('biome');
  else if (e.key === 'e' || e.key === 'E' || e.key === 'у' || e.key === 'У') setTool('erase');
  else if (e.key === '+' || e.key === '=') zoomTo(view.zoom*1.35, 0.5, 0.5);
  else if (e.key === '-' || e.key === '_') zoomTo(view.zoom/1.35, 0.5, 0.5);
  else if (e.key === '0') { view.zoom = 1; view.cx = COLS/2; view.cy = ROWS/2; updateZoomUI(); }
  else if (e.key === 'ArrowLeft')  { view.cx -= COLS/view.zoom*0.1; clampView(); }
  else if (e.key === 'ArrowRight') { view.cx += COLS/view.zoom*0.1; clampView(); }
  else if (e.key === 'ArrowUp')    { view.cy -= ROWS/view.zoom*0.1; clampView(); }
  else if (e.key === 'ArrowDown')  { view.cy += ROWS/view.zoom*0.1; clampView(); }
});

/* ============================================================
   ИГРОВОЙ ЦИКЛ
   ============================================================ */
let lastTs = 0, acc = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.1, (ts-lastTs)/1000);
  lastTs = ts;
  if (running) {
    acc += dt*speed;
    let steps = 0;
    while (acc >= 1 && steps < 40) { acc -= 1; tick(); steps++; }
  }
  render(ts);
  uiAcc += dt;
  if (uiAcc > 0.15) { uiAcc = 0; updateUINumbers(); }
}

/* ============================================================
   СТАРТ
   ============================================================ */
function newWorld() {
  civs = []; activeDisasters = []; activeLava.clear();
  year = 0; logEntries = [];
  selectedCivId = -1; hoverCivId = -1;
  view.cx = COLS/2; view.cy = ROWS/2; view.zoom = 1;
  clearArmedDisaster();
  setTool('view');
  renderLog();
  generate();
  for (let i=0; i<DEFAULT_CIVS; i++) spawnRandomCiv();
  addLog('🌍 Мир создан. Да начнётся история!');
  addLog('💡 Выберите цивилизацию в списке и рисуйте её территорию. ➕ добавит новую, ✕ удалит.');
  rebuildCivList();
  rebuildDetails();
  rebuildPaintBanner();
  updateZoomUI();
  updateUINumbers();
  if (isMobile()) closeDrawers();
}

window.addEventListener('resize', () => { resizeCanvas(); syncToolButtons(); });
window.addEventListener('orientationchange', () => {
  setTimeout(() => { resizeCanvas(); syncToolButtons(); }, 200);
});

// Также пересобираем при изменении медиа-запроса
const mqMobile = window.matchMedia('(max-width: 820px)');
mqMobile.addEventListener('change', () => { syncToolButtons(); resizeCanvas(); });

resizeCanvas();
newWorld();

requestAnimationFrame(() => {
  resizeCanvas();
  requestAnimationFrame(() => {
    resizeCanvas();
    updateUINumbers();
    requestAnimationFrame(loop);
  });
});
setTimeout(() => { resizeCanvas(); markTerrainFull(); }, 300);
</script>
</body>
